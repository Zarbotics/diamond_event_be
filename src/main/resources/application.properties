# ===================================================================
# Diamond Events — application configuration
# ===================================================================
#
# SECRETS ARE NOT STORED IN THIS FILE.
#
# Every credential below is read from an environment variable and has no
# fallback, so the application fails fast on startup if one is missing rather
# than silently running with a wrong or shared value.
#
# See `.env.example` for the full list and `README.md` for how to supply them.
#
# NOTE: the values that previously lived here (database password, SSL keystore
# password, Google OAuth client secret, JWT signing secret and the Gmail app
# password) remain in this repository's git history and must all be rotated.
# ===================================================================

# -------------------------------
# Server
# -------------------------------
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/api/diamond

# -------------------------------
# Database
# -------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# -------------------------------
# JPA / Hibernate
# -------------------------------
# The schema is owned by Flyway, not by Hibernate. `validate` makes the
# application refuse to start if the entities and the database have drifted,
# which is what we want: previously `update` let Hibernate silently mutate the
# live schema on every deploy, with no review, no record and no way back.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# -------------------------------
# Flyway
# -------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# -------------------------------
# Time zone
# -------------------------------
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

# -------------------------------
# Logging
# -------------------------------
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.com.zbs=INFO

# -------------------------------
# General
# -------------------------------
spring.main.allow-bean-definition-overriding=true
spring.application.name=de

# -------------------------------
# TLS
# -------------------------------
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEYSTORE_PATH:/root/diamondevent_be/plesk_crt.pfx}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12

# -------------------------------
# Uploaded file serving
# -------------------------------
spring.web.resources.static-locations=file:${UPLOAD_DIR:/root/diamondevent_be/uploads/}
spring.mvc.static-path-pattern=/uploads/**
app.upload.dir=${UPLOAD_DIR:/root/diamondevent_be/uploads/}

# -------------------------------
# Frontend URLs
# -------------------------------
app.frontend.base-url=${FRONTEND_BASE_URL:https://diamondevents.uk}
app.frontend.admin-url=${FRONTEND_ADMIN_URL:https://diamondevents.uk/admin}
app.frontend.logout-redirect-url=${FRONTEND_BASE_URL:https://diamondevents.uk}/client-journey
app.frontend-email-verification-url=${FRONTEND_BASE_URL:https://diamondevents.uk}/client-journey

# -------------------------------
# CORS — comma-separated list of allowed origins
# -------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://diamondevents.uk}

# -------------------------------
# Google SSO
# -------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# -------------------------------
# Apple SSO
# -------------------------------
apple.client-id=${APPLE_CLIENT_ID:co.uk.zarbotics.web.sso}
apple.team-id=${APPLE_TEAM_ID:PG2K36MM95}
apple.key-id=${APPLE_KEY_ID:3HAK9XZ2TV}
apple.private-key-file=${APPLE_PRIVATE_KEY_FILE:/opt/keys/apple/AuthKey_3HAK9XZ2TV.p8}

spring.security.oauth2.client.registration.apple.client-id=${apple.client-id}
# Overridden dynamically at runtime by DelegatingTokenResponseClient.
spring.security.oauth2.client.registration.apple.client-secret=dummy
spring.security.oauth2.client.registration.apple.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.apple.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.apple.redirect-uri={baseUrl}/login/oauth2/code/apple
spring.security.oauth2.client.registration.apple.scope=name,email
spring.security.oauth2.client.registration.apple.client-name=Apple

spring.security.oauth2.client.provider.apple.authorization-uri=https://appleid.apple.com/auth/authorize?response_mode=form_post
spring.security.oauth2.client.provider.apple.token-uri=https://appleid.apple.com/auth/token
spring.security.oauth2.client.provider.apple.jwk-set-uri=https://appleid.apple.com/auth/keys
spring.security.oauth2.client.provider.apple.user-name-attribute=sub

# -------------------------------
# JWT
# -------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.verification-expiration=${JWT_VERIFICATION_EXPIRATION_MS:604800000}

# -------------------------------
# Mail
# -------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# -------------------------------
# Reporting
# -------------------------------
report.images.folder=${UPLOAD_DIR:/root/diamondevent_be/uploads/}reports

# -------------------------------
# Uploads
# -------------------------------
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=30MB
# Defers multipart parsing until the controller is hit, so the DispatcherServlet
# can forward the exception to @RestControllerAdvice.
spring.servlet.multipart.resolve-lazily=true
