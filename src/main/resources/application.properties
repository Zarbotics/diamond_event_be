# ===================================================================
# Diamond Events — application configuration
# ===================================================================
#
# This file is the DEVELOPMENT default. A clean checkout should start with
# nothing but a local PostgreSQL running:
#
#     createdb diamond_ev
#     ./mvnw spring-boot:run
#
# Every value below can be overridden by an environment variable, and
# production overrides all of them plus activates the `prod` profile, which
# tightens the settings that must not stay at their development values:
#
#     SPRING_PROFILES_ACTIVE=prod
#
# NO PRODUCTION SECRET LIVES IN THIS FILE. The development defaults here are
# deliberately useless outside a laptop, and `prod` refuses to start if any of
# them is still in place — see application-prod.properties.
#
# NOTE: the real database password, SSL keystore password, Google OAuth client
# secret, JWT signing secret and Gmail app password were previously committed
# here and remain readable in this repository's git history. All must be
# rotated regardless of this change.
# ===================================================================

# -------------------------------
# Server
# -------------------------------
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/diamond

# -------------------------------
# Database
# -------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/diamond_ev}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# -------------------------------
# JPA / Hibernate
# -------------------------------
# Hibernate still owns the schema. Flyway is present and versioned, but there
# is no V1 baseline that can recreate the existing production schema from
# scratch — capturing one requires a dump of production, which is the next
# step. Until then `update` is what lets a fresh database work at all, and
# `validate` would refuse to start against anything Hibernate had not built.
#
# Production can move to `validate` the day a real baseline exists; see
# db/migration/README.md.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# Left at Spring Boot's default (true) deliberately. Existing controllers and
# mappers serialise lazy associations after the transaction has closed, and
# turning it off makes those fail with LazyInitializationException. It should
# be turned off eventually, but only alongside the DTO work that stops
# entities being serialised at all.
spring.jpa.open-in-view=true

# -------------------------------
# Flyway
# -------------------------------
# baseline-on-migrate lets Flyway adopt the existing production schema as
# version 1 without trying to recreate it. On an empty database there is
# nothing to adopt, so the migrations themselves are written to be safe when
# the tables they touch do not exist yet.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# -------------------------------
# Time zone
# -------------------------------
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

# -------------------------------
# Logging
# -------------------------------
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.com.zbs=INFO

# -------------------------------
# General
# -------------------------------
spring.main.allow-bean-definition-overriding=true
spring.application.name=de

# -------------------------------
# TLS
# -------------------------------
# Off for local development; production runs behind TLS and sets these.
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE_PATH:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12

# -------------------------------
# Uploaded file serving
# -------------------------------
spring.web.resources.static-locations=file:${UPLOAD_DIR:./uploads/}
spring.mvc.static-path-pattern=/uploads/**
app.upload.dir=${UPLOAD_DIR:./uploads/}

# -------------------------------
# Frontend URLs
# -------------------------------
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.frontend.admin-url=${FRONTEND_ADMIN_URL:http://localhost:3000}
app.frontend.logout-redirect-url=${FRONTEND_BASE_URL:http://localhost:5173}/client-journey
app.frontend-email-verification-url=${FRONTEND_BASE_URL:http://localhost:5173}/client-journey

# -------------------------------
# Consultations
# -------------------------------
# Printed in every consultation email as the way to reach a person. A customer
# whose request was declined, or whose meeting the team had to cancel, needs
# somewhere to go that is not another form.
app.consultation.contact-phone=${CONSULTATION_CONTACT_PHONE:0121 200 0000}

# -------------------------------
# Calendar sync (optional)
# -------------------------------
# All of this is optional. With none of it set, consultations work exactly as
# they do otherwise — they simply do not appear in anybody's Google or Outlook,
# and no joining link is created. That is the state every installation starts
# in, and a small team may never leave it.
#
# Each adapter registers as a bean only when its client id is present, so an
# unset provider is absent rather than present-and-failing.
#
# ---- Encryption of the stored tokens ----
# Required before any calendar can be connected. A refresh token is a standing
# grant to read and write the team's calendars until somebody revokes it, so it
# is never written in the clear: with no key set, connecting is refused rather
# than falling back to plaintext.
#
#   openssl rand -base64 32
#
app.calendar.token-key=${CALENDAR_TOKEN_KEY:}

# ---- Google ----
# From a Google Cloud project, at console.cloud.google.com:
#   1. Enable the Google Calendar API.
#   2. Create an OAuth 2.0 Client ID of type "Web application".
#   3. Add this backend's callback as an authorised redirect URI.
#   4. Request only these scopes:
#        https://www.googleapis.com/auth/calendar.freebusy      (read)
#        https://www.googleapis.com/auth/calendar.app.created   (write)
#
# The narrow write scope is deliberate: it creates a calendar this application
# owns and can only touch what it put there. The broad "calendar" scope now
# attracts a heavier verification review and asks people for far more than this
# needs.
#
# This may live in the same Cloud project as "Continue with Google" sign-in,
# but it is a separate concern — sign-in identifies a customer, this reads a
# team member's availability.
app.calendar.google.client-id=${CALENDAR_GOOGLE_CLIENT_ID:}
app.calendar.google.client-secret=${CALENDAR_GOOGLE_CLIENT_SECRET:}

# ---- Microsoft ----
# From an app registration in Microsoft Entra ID (formerly Azure AD), at
# entra.microsoft.com:
#   1. Register an application and add this backend's callback as a redirect URI.
#   2. Create a client secret and note its value — it is shown once.
#   3. Add these DELEGATED permissions (not application permissions):
#        Calendars.ReadBasic     (read availability)
#        Calendars.ReadWrite     (write the consultation)
#        offline_access          (without this there is no refresh token at all)
#
# Delegated means acting as the person who connected their own account, never
# as the organisation. Application permissions would read every mailbox in the
# tenant, which is a far larger thing to be responsible for and buys nothing.
#
# tenant: "common" lets people on any Microsoft tenant connect. Pin your own
# tenant id instead if every host is in one organisation.
app.calendar.microsoft.client-id=${CALENDAR_MICROSOFT_CLIENT_ID:}
app.calendar.microsoft.client-secret=${CALENDAR_MICROSOFT_CLIENT_SECRET:}
app.calendar.microsoft.tenant=${CALENDAR_MICROSOFT_TENANT:common}

# -------------------------------
# CORS — comma-separated list of allowed origins
# -------------------------------
# Development runs the two frontends on 5173 and 3000. Production replaces
# this entirely; `prod` fails to start if localhost is still listed.
#
# Both spellings of the loopback address are listed. `localhost` and
# `127.0.0.1` are different origins as far as the browser is concerned, so a
# developer who opened http://127.0.0.1:5173 — which is what `vite --host`
# prints, and what several tools default to — got every request blocked by CORS
# while a colleague on http://localhost:5173 saw nothing wrong.
# Vite takes 5173, but steps to 5174, 5175 and so on when that port is busy —
# a stale dev server, or a second checkout — and it does so with only a line
# of notice in the terminal. On the wrong port every API call is blocked by
# CORS, which surfaces in the browser as failed requests rather than as
# anything naming the port, so the cause is not obvious from the symptom.
# The fallbacks are listed for that reason. This is a development default
# only: ProductionConfigCheck refuses to start the application when the
# allowed origins still mention localhost.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:3000,http://127.0.0.1:3000}

# -------------------------------
# Google SSO
# -------------------------------
# Placeholder credentials so the application starts without them. Sign-in with
# Google will not work until real values are supplied, which is the right
# behaviour for a machine that has none.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-dev-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-dev-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# -------------------------------
# Apple SSO — OPT IN
# -------------------------------
# Apple is deliberately NOT registered here. There is one Apple developer
# account and one signing key, so Apple sign-in exists in production only —
# which is exactly how the development branches are set up today, with Google
# alone.
#
# Registering it unconditionally would mean every developer needs a copy of
# the .p8 signing key on disk, and Apple sign-in would appear to be available
# on machines where it cannot possibly work.
#
# To enable it, activate the `apple` profile alongside your others:
#
#     SPRING_PROFILES_ACTIVE=prod,apple
#
# See application-apple.properties.
apple.enabled=${APPLE_ENABLED:false}
apple.client-id=${APPLE_CLIENT_ID:co.uk.zarbotics.web.sso}
apple.team-id=${APPLE_TEAM_ID:}
apple.key-id=${APPLE_KEY_ID:}
apple.private-key-file=${APPLE_PRIVATE_KEY_FILE:}

# -------------------------------
# JWT
# -------------------------------
# Development-only signing secret. `prod` refuses to start with this value.
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2lnbmluZy1zZWNyZXQtbm90LWZvci1wcm9kdWN0aW9uLXVzZS0xMjM0}
app.jwt.expiration=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.verification-expiration=${JWT_VERIFICATION_EXPIRATION_MS:604800000}

# -------------------------------
# Mail
# -------------------------------
# Optional in development. Without credentials the application still starts;
# sending an email is what fails, and only when something tries.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# -------------------------------
# Reporting
# -------------------------------
report.images.folder=${UPLOAD_DIR:./uploads/}reports

# -------------------------------
# Uploads
# -------------------------------
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=30MB
# Defers multipart parsing until the controller is hit, so the DispatcherServlet
# can forward the exception to @RestControllerAdvice.
spring.servlet.multipart.resolve-lazily=true
