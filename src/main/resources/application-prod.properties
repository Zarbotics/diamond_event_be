# ===================================================================
# Production / demo profile
#
# Both branches grew one of these independently, so this is the merge of
# the two:
#
#   - from the demo deployment: the container's own realities — the
#     `/api/diamond` context path the public URL is built on, the Postgres
#     container's hostname, and the /app/uploads volume.
#
#   - from the platform rebuild: everything comes from the environment with
#     no default, so a missing setting stops the application rather than
#     letting it run on a development value. ProductionConfigCheck refuses
#     to start on the development JWT secret, a CORS list that still trusts
#     localhost, an unset database password, or a ddl-auto that would drop
#     the schema.
#
# The full list of variables is in .env.example.
# ===================================================================

# -------------------------------
# Server
# -------------------------------
server.port=${SERVER_PORT:8080}

# The public API is https://<api-host>/api/diamond/… and that prefix is the
# application's own, not the proxy's. Plesk passes the path through unchanged.
server.servlet.context-path=/api/diamond

# Plesk terminates TLS and forwards plain HTTP, so the application holds no
# certificate. Without the forwarded headers below it would build http:// links
# into verification emails and OAuth redirect URIs.
server.ssl.enabled=${SSL_ENABLED:false}
server.forward-headers-strategy=framework

# -------------------------------
# Database
# -------------------------------
# Composed from the Postgres container's own variables, so one set of
# credentials serves both the database and the application. DB_URL overrides it
# for a database that is not the sibling container.
spring.datasource.url=${DB_URL:jdbc:postgresql://diamond-postgres:5432/${POSTGRES_DB}}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# -------------------------------
# Schema
# -------------------------------
# Flyway owns it. This profile used to say `update`, which lets Hibernate alter
# tables behind Flyway's back — the two then disagree about what the schema is,
# and the migration that notices is the one that fails.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

# -------------------------------
# Where the browser clients are
# -------------------------------
# No defaults. CORS_ALLOWED_ORIGINS is checked at startup: no localhost, no
# wildcard — a wildcard cannot be used with credentialed requests at all.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.frontend.base-url=${FRONTEND_BASE_URL}
app.frontend.admin-url=${FRONTEND_ADMIN_URL}
app.frontend.logout-redirect-url=${FRONTEND_BASE_URL}/client-journey
app.frontend-email-verification-url=${FRONTEND_EMAIL_VERIFICATION_URL:${FRONTEND_BASE_URL}/client-journey}

# -------------------------------
# Signing
# -------------------------------
# No default, deliberately. The development secret is in application.properties
# in plain sight and is in this repository's history; anyone holding it can mint
# a token for any user, administrators included.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.verification-expiration=${JWT_VERIFICATION_EXPIRATION_MS:604800000}

# -------------------------------
# Google sign-in
# -------------------------------
# The redirect URI is built from {baseUrl} — the application's own view of its
# address — which is why the forwarded headers above matter. Get them wrong and
# Spring sends Google a URI that does not match what was registered, and the
# error appears on Google's page rather than ours.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# -------------------------------
# Mail
# -------------------------------
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# -------------------------------
# Uploads
# -------------------------------
# A volume, not the image. Anything written here has to survive a redeploy.
app.upload.dir=${UPLOAD_DIR:/app/uploads/}

# What the browser is told to fetch an uploaded picture from.
#
# It has to be ABSOLUTE here, and it has to point at the API host. The stored
# value is handed to the front end, which is on a different origin — so a
# relative URL resolves against the front end's host, where the file does not
# exist and nothing is listening on that path.
#
# It also has to carry the context path. The code's default is
# `/diamond/deimg`, which was right when the context path was `/diamond`; this
# profile serves on `/api/diamond`, so a default left alone is wrong by one
# path segment and every picture 404s.
app.upload.public-base-url=${UPLOAD_PUBLIC_BASE_URL}
spring.web.resources.static-locations=file:${UPLOAD_DIR:/app/uploads/}
report.images.folder=${UPLOAD_DIR:/app/uploads/}reports

# -------------------------------
# Runtime
# -------------------------------
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
logging.level.org.springframework=INFO
logging.level.com.zbs=INFO
