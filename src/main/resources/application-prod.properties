# ===================================================================
# Production overrides
# ===================================================================
#
#     SPRING_PROFILES_ACTIVE=prod          (Google only)
#     SPRING_PROFILES_ACTIVE=prod,apple    (Google + Apple)
#
# Everything here must come from the environment. ProductionConfigCheck runs
# at startup and refuses to boot if any development default survived — a
# silent fallback to a shared signing secret or a localhost CORS origin is
# worse than not starting.
# ===================================================================

# Required — no fallbacks.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.frontend.base-url=${FRONTEND_BASE_URL}
app.frontend.admin-url=${FRONTEND_ADMIN_URL}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# TLS terminates here today; set SSL_ENABLED=false if a reverse proxy does it.
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEYSTORE_PATH}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}

spring.web.resources.static-locations=file:${UPLOAD_DIR}
app.upload.dir=${UPLOAD_DIR}
report.images.folder=${UPLOAD_DIR}reports

# Never in production: DevTools exposes a restart endpoint, and show-sql
# writes every query — including customer data — to the log.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.jpa.show-sql=false
